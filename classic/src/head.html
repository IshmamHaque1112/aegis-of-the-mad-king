<title>Aegis of the Mad King</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Pirata+One&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one phone-height column. Map fills the middle; everything else is a tool strip. The season recolors the accent. */
:root{color-scheme:dark;--ink:#10151a;--panel:#1a2228;--panel2:#232d33;--line:#39464c;--bone:#ece4d2;--muted:#a3aca6;--good:#8bd09a;--bad:#ef7564;--warn:#ecbb55;--acc:#7fd08a;--acc-ink:#10151a;--disp:"Pirata One",Georgia,serif;--body:"Alegreya Sans","Trebuchet MS",sans-serif;--pix:"Pixelify Sans",ui-monospace,Menlo,monospace}
:root[data-season="1"]{--acc:#e8c34e}:root[data-season="2"]{--acc:#e8843f}:root[data-season="3"]{--acc:#8fd0f2}
html,body{height:100%;background:var(--ink);color:var(--bone);font:16px/1.35 var(--body);overscroll-behavior:none}
body{overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit;color:inherit}
button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
.screen{height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow-y:auto}
.btn{background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:3px;font-weight:700}.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.btn.big{font-size:18px;padding:14px 24px}.btn.sm{padding:3px 9px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
/* title */
#title{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}.tin{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}#title h1{font:400 clamp(44px,14vw,74px)/.95 var(--disp);text-wrap:balance;color:var(--bone)}#title h1 em{font-style:normal;color:var(--acc)}.tmap{position:relative;width:100%;max-width:300px;aspect-ratio:1;align-self:center}.tmap canvas{width:100%;height:100%;image-rendering:pixelated;display:block;border-radius:50%}.tmap span{position:absolute;right:0;bottom:6px;font:700 15px var(--pix);color:var(--acc);background:var(--ink);padding:1px 7px}.lead{color:var(--muted);max-width:60ch}.trow{display:flex;gap:10px;flex-wrap:wrap}.trow .btn{flex:1 1 140px}
/* create */
#create .cin{max-width:620px;margin:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:90px}#create h2{font:400 34px var(--disp);color:var(--acc)}#classes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.classcard{text-align:left;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:3px;display:flex;flex-direction:column;gap:5px}.classcard h3{font:700 18px var(--body)}.classcard p{font-size:14px;color:var(--muted);flex:1}.classcard.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.cstats{display:flex;gap:9px;font:500 13px var(--pix);color:var(--muted);flex-wrap:wrap}.cstats b{color:var(--bone)}.fld{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}.fld span{font-size:13px;color:var(--muted);letter-spacing:.03em}input,select{background:var(--panel2);border:1px solid var(--line);padding:9px;border-radius:3px;width:100%;min-width:0}.frow{display:flex;gap:8px;flex-wrap:wrap}.frow .fld{flex:1 1 140px}.begin{position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 30%);padding-top:18px;display:flex;gap:8px}.begin .pri{flex:1}
/* game */
#game{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px;gap:5px;max-width:720px;margin:auto}
.top{display:flex;flex-direction:column;gap:3px}.ctx{display:flex;justify-content:space-between;gap:8px;align-items:baseline}#when{font:700 16px var(--pix);color:var(--acc);white-space:nowrap}#where{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.m{position:relative;background:#0a0d11;border:1px solid var(--line);height:21px;overflow:hidden}.m i{position:absolute;inset:0 auto 0 0;display:block;opacity:.72}.m b{position:relative;display:block;font:500 11.5px/19px var(--pix);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 0 3px #000}.m em{position:absolute;left:3px;top:0;font:700 9px/19px var(--pix);font-style:normal;opacity:.75}.m.hp i{background:#b23a3a}.m.mp i{background:#4560c0}.m.fd i{background:#a5742f}.m.wt i{background:#2d82a8}.m.tp i{background:linear-gradient(90deg,#5ab0e0,#7a8a70,#d9602f)}.m.low{border-color:var(--bad)}#badges{display:flex;gap:4px;flex-wrap:wrap;min-height:0}.bdg{font-size:12px;background:var(--panel2);padding:0 6px;border-radius:2px}.bdg.bad{background:#5a2522;color:#ffc9c0}.bdg.ok{background:#25452e;color:#bff0c9}
#mapbox{flex:1 1 0;min-height:0;position:relative;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}#map{display:block;image-rendering:pixelated;touch-action:none;background:#0a0d11;cursor:pointer}
#hint{position:absolute;left:0;right:0;top:0;background:#000c;padding:6px 8px;font-size:14px;display:flex;gap:8px;justify-content:space-between;align-items:center}
#banner{position:absolute;left:8px;right:8px;top:8px;background:#0a0d11f2;border:1px solid var(--acc);padding:12px 14px;display:flex;flex-direction:column;gap:7px;max-height:calc(100% - 16px);overflow:auto}#banner h2{font:400 40px/1 var(--disp);color:var(--acc)}#banner p{font-weight:500}#banner ul{padding-left:18px;font-size:14px;color:var(--muted)}#banner .btn{align-self:flex-start}
#log{height:78px;overflow-y:auto;background:#0a0d11;border:1px solid var(--line);padding:4px 7px;font-size:13.5px;line-height:1.25;flex:none}#log p{color:var(--muted)}#log p:last-child{color:var(--bone)}#log p.bad{color:var(--bad)}#log p.good{color:var(--good)}#log p.warn{color:var(--warn)}#log p.story,#log p.season{color:var(--acc);font-weight:500}#log p.say{color:#d8cfe8;font-style:italic}#log p.kill{color:#e79a8e}#log p.hint{color:#b6c9c0}#log p.wx{color:#9cc2d6}
.ctl{display:grid;grid-template-columns:1fr auto;gap:8px;flex:none}.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:stretch}.acts button{background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;padding:0 2px;min-height:44px}.acts button.on{background:var(--acc);color:var(--acc-ink)}.pad{display:grid;grid-template-columns:repeat(3,44px);grid-auto-rows:44px;gap:3px}.pad button{background:var(--panel2);border:1px solid var(--line);font:700 17px var(--pix);padding:0}.pad .dg{background:var(--panel);color:var(--muted);font-size:14px}.pad #here{background:var(--panel);font:700 11px var(--body);color:var(--acc)}
/* sheet */
#sheet{position:fixed;inset:0;background:#000a;display:flex;flex-direction:column;justify-content:flex-end;z-index:20}.sheetbox{background:var(--panel);border-top:2px solid var(--acc);max-height:82%;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:9px}.sheethd{display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;top:-12px;background:var(--panel);padding-block:5px;z-index:2}.sheethd h3{font:400 26px/1.05 var(--disp);color:var(--acc);text-wrap:balance}.closex{background:none;border:1px solid var(--line);padding:4px 10px;font-size:13px;border-radius:2px}.sheettxt{color:var(--bone);font-size:15px}.opts{display:flex;flex-direction:column;gap:4px}.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);padding:9px 11px;display:flex;flex-direction:column;gap:1px;min-height:42px;font-weight:500}.opt small{font-weight:400;color:var(--muted);font-size:13px}.opt.pri{border-color:var(--acc);color:var(--acc)}.opt.bad span{color:#ffb4a8}.opt:disabled{opacity:.48;cursor:not-allowed}
.char{display:flex;flex-direction:column;gap:6px}.char h4,.alm h4{font:700 14px var(--body);color:var(--acc);letter-spacing:.05em;text-transform:uppercase;padding-top:6px}.small{font-size:14px;color:var(--muted)}.statrow{display:grid;grid-template-columns:96px 1fr 26px auto;gap:7px;align-items:center;font-size:14px}.statrow b{font:700 14px var(--pix);text-align:right}.pips{display:flex;gap:2px}.pips i{flex:1;height:9px;background:#0a0d11;border:1px solid var(--line)}.pips i.on{background:var(--acc)}.rep{color:var(--muted)}.qline{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:14.5px}.qline b{font:700 11px/1.7 var(--pix);color:var(--muted)}.qline.done b{color:var(--good)}.qline.done span{text-decoration:line-through;color:var(--muted)}.qline small{display:block;color:var(--muted);font-size:13px}.alm ul{padding-left:18px;font-size:14px}.alm{padding-bottom:4px}.alm.cur h4{color:var(--bone)}.fulllog p{font-size:14px;color:var(--muted);padding-block:1px}.fulllog .bad{color:var(--bad)}.fulllog .good{color:var(--good)}.fulllog .warn{color:var(--warn)}.mapwrap{overflow:auto;max-width:100%}.worldmap{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.forge{display:flex;flex-direction:column;gap:9px}.preview{font-size:14px;color:var(--muted);background:#0a0d11;border:1px solid var(--line);padding:8px}.preview b{color:var(--acc)}.fxrow{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);padding:8px}.fxd{color:var(--muted)}.fxlist{display:flex;flex-direction:column;gap:6px}.rng{display:flex;flex-direction:column;font-size:13px}.rng input{padding:0;accent-color:var(--acc);background:none;border:0}.rng b{font-family:var(--pix);color:var(--acc)}.fxrow .btn{align-self:flex-start}
/* end */
#end{height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}.endin{max-width:560px;margin:auto;display:flex;flex-direction:column;gap:12px}.eyebrow{font:500 14px var(--pix);color:var(--acc)}#end h1{font:400 clamp(44px,12vw,70px)/.95 var(--disp);text-wrap:balance}.rate{font-weight:700;color:var(--acc)}#end h3{font:700 14px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:6px}#end ol{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px}#end ol small{display:inline-block;width:58px;font:500 12px var(--pix);color:var(--acc)}#end dl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:15px}#end dd{font:500 14px var(--pix);text-align:right}#end dt{color:var(--muted)}
@media (min-width:900px){#game{max-width:1040px;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto 1fr auto auto;column-gap:14px}.top{grid-column:1/3}#mapbox{grid-column:1;grid-row:2/5}#log{grid-column:2;grid-row:2;height:auto}.ctl{grid-column:2;grid-row:3/5;grid-template-columns:1fr}.acts{order:2}.pad{margin:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="title" class="screen"><div class="tin"><div class="tmap"><canvas id="tcv" aria-label="A generated continent"></canvas><span id="tseason">Spring</span></div><h1>Aegis of the <em>Mad King</em></h1><p class="lead">One continent, four seasons, one death. Break an immortal king's amulet by blade, fire, plague, lie, or mercy. The world remembers what you did.</p><div class="trow"><button id="newbtn" class="btn pri big">New game</button><button id="contbtn" class="btn big" hidden>Continue</button></div></div></div>
<div id="create" class="screen" hidden><div class="cin"><h2>Who sets out?</h2><div id="classes"></div><div class="frow"><label class="fld"><span>Name</span><input id="pname" maxlength="18" placeholder="Leave blank for a random name"></label><label class="fld"><span>World</span><select id="psize"><option value="96">Continent, 96 × 96</option><option value="48">Expedition, 48 × 48 (quicker)</option></select></label><label class="fld"><span>Seed</span><input id="pseed" placeholder="Random"></label></div><div class="begin"><button id="backbtn" class="btn">Back</button><button id="dailybtn" class="btn">Daily seed</button><button id="beginbtn" class="btn pri big">Begin</button></div></div></div>
<div id="game" hidden><div class="top"><div class="ctx"><span id="when">Spring</span><span id="where"></span></div><div class="meters"><div id="m-hp" class="m hp"><i></i><em>HP</em><b></b></div><div id="m-mp" class="m mp"><i></i><em>MP</em><b></b></div><div id="m-fd" class="m fd"><i></i><em>FD</em><b></b></div><div id="m-wt" class="m wt"><i></i><em>WT</em><b></b></div><div id="m-tp" class="m tp"><i></i><b></b></div></div><div id="badges"></div></div><div id="mapbox"><canvas id="map" aria-label="Game map. Tap a tile to walk or act."></canvas><div id="hint" hidden></div><div id="banner" hidden></div></div><div id="log" aria-live="polite"></div><div class="ctl"><div class="acts"><button id="packbtn">Pack</button><button id="magicbtn">Magic</button><button id="craftbtn">Craft</button><button id="buildbtn">Build</button><button id="sneakbtn">Sneak</button><button id="menubtn">Menu</button><button id="waitbtn" style="grid-column:1/-1;min-height:36px">Wait a turn</button></div><div class="pad"><button class="dg" data-d="-1,-1" aria-label="Northwest">↖</button><button data-d="0,-1" aria-label="North">↑</button><button class="dg" data-d="1,-1" aria-label="Northeast">↗</button><button data-d="-1,0" aria-label="West">←</button><button id="here">HERE</button><button data-d="1,0" aria-label="East">→</button><button class="dg" data-d="-1,1" aria-label="Southwest">↙</button><button data-d="0,1" aria-label="South">↓</button><button class="dg" data-d="1,1" aria-label="Southeast">↘</button></div></div></div>
<div id="end" hidden></div>
<div id="sheet" hidden></div>
<script>
