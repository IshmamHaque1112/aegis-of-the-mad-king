<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117"><meta name="description" content="An open-world roguelike: break the Aegis of the Mad King.">
<title>Aegis of the Mad King</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>@font-face{font-family:"Pirata One";src:url(fonts/PirataOne-Regular.ttf) format("truetype");font-display:swap}@font-face{font-family:"Pixelify Sans";src:url(fonts/PixelifySans.ttf) format("truetype");font-weight:400 700;font-display:swap}@font-face{font-family:"Alegreya Sans";src:url(fonts/AlegreyaSans-Regular.ttf) format("truetype");font-weight:400;font-display:swap}@font-face{font-family:"Alegreya Sans";src:url(fonts/AlegreyaSans-Medium.ttf) format("truetype");font-weight:500;font-display:swap}@font-face{font-family:"Alegreya Sans";src:url(fonts/AlegreyaSans-Bold.ttf) format("truetype");font-weight:700;font-display:swap}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Pirata+One&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#151b24;--panel:#1a212c;--panel2:#222b38;--line:#2f3a4a;--ink:#efe6d2;--ink2:#b9ad95;--mute:#7d7462;--gold:#e8b64c;--gold2:#ffd77a;--red:#e0604f;--green:#7fc47a;--blue:#6fb3e0;--violet:#b58ee8;--acc:#e8b64c;--r:10px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html[data-season="0"]{--acc:#9fdc8a}html[data-season="1"]{--acc:#ffd06a}html[data-season="2"]{--acc:#f0975a}html[data-season="3"]{--acc:#a9d4f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 "Alegreya Sans",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Pirata One",serif;font-weight:400;letter-spacing:.02em;margin:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-height:44px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--gold)}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(#e8b64c,#c48d2a);border-color:#f3cf7a;color:#1b1206;font-weight:700}.btn.pri:hover{background:linear-gradient(#f3c55d,#d29a34)}
.btn.big{font-size:20px;padding:14px 28px;min-width:220px}.btn.sm{min-height:32px;padding:4px 10px;font-size:14px}.btn:disabled{opacity:.45;cursor:default}
/* title */
.screen{position:fixed;inset:0;overflow:auto;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#1d2633 0,#0d1117 70%)}
#tcv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:.38;filter:saturate(1.1) blur(.4px)}
.tvig{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(13,17,23,.25) 0,rgba(13,17,23,.92) 75%);pointer-events:none}
.tin{position:relative;text-align:center;max-width:620px}
.logo{width:min(140px,34vw);filter:drop-shadow(0 6px 24px rgba(232,182,76,.35))}
#title h1{font-size:clamp(44px,10vw,84px);line-height:.95;color:var(--gold2);text-shadow:0 3px 0 #5a3a10,0 0 40px rgba(232,182,76,.35);margin:6px 0 8px}
.tag{color:var(--ink2);font-size:18px;margin:0 auto 26px;max-width:480px}
.tbtns{display:flex;flex-direction:column;gap:10px;align-items:center}
.tfoot{margin-top:26px;color:var(--mute);font-size:14px}.tfoot b{color:var(--acc);font-weight:500}
/* create */
#create{background:var(--bg)}.cin{max-width:1060px;margin:0 auto;padding-bottom:24px}
#create h2{font-size:38px;color:var(--gold2)}#create h4{font-family:"Pixelify Sans";font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:22px 0 10px}
#classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.classcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;transition:border-color .15s,background .15s}
.classcard h3{font-size:24px;color:var(--ink)}.classcard p{margin:4px 0 8px;color:var(--ink2);font-size:14px;min-height:3.8em}
.classcard.sel{border-color:var(--gold);background:#2a2618;box-shadow:inset 0 0 0 1px var(--gold)}.classcard:hover{border-color:var(--gold)}
.cstats{display:flex;gap:8px;flex-wrap:wrap;font:12px "Pixelify Sans";color:var(--mute)}.cstats b{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;font-size:15px}.chip.on{background:var(--gold);color:#1b1206;border-color:var(--gold2);font-weight:700}
.bgdesc{color:var(--ink2);margin:8px 2px 0;font-size:15px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
#wopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.fld select,.fld input,.fxrow select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;min-height:42px;min-width:0;width:100%;box-sizing:border-box}
.cbar{position:sticky;bottom:-16px;display:flex;justify-content:space-between;gap:10px;padding:14px 0;margin-top:20px;background:linear-gradient(transparent,var(--bg) 30%)}
#loading{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);font:20px "Pixelify Sans";color:var(--gold2)}
.spin{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
/* game */
#game{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding-top:var(--safe-t)}
.hud{display:flex;flex-direction:column;gap:4px;padding:6px 8px 4px;background:linear-gradient(var(--bg2),rgba(21,27,36,.96));border-bottom:1px solid var(--line);z-index:2}
.meters{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mt{position:relative;height:20px;background:#0a0e14;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mt i{position:absolute;inset:0 auto 0 0;transition:width .25s}.mt b{position:relative;display:block;font:500 11px/18px "Pixelify Sans";text-align:center;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden}
.mt span{position:absolute;left:4px;top:0;font:10px/18px "Pixelify Sans";opacity:.7;z-index:1}
#m-hp i{background:linear-gradient(#e0604f,#a83a2c)}#m-mp i{background:linear-gradient(#7c8ee8,#4e5cb8)}#m-fd i{background:linear-gradient(#d9a04a,#a8702a)}#m-wt i{background:linear-gradient(#6fb3e0,#3e7fb0)}#m-tp i{background:linear-gradient(90deg,#5aa0e0,#8fd08a 45%,#8fd08a 55%,#e07a40)}#m-ch i{background:linear-gradient(#ffe066,#d8a820)}
.mt.low{border-color:var(--red);animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(224,96,79,.45)}}
.info{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.info #when{color:var(--acc);font-weight:700}#moon{font-size:15px;color:#f1ead0}#where{overflow:hidden;text-overflow:ellipsis;flex:1}#who{color:var(--mute)}
#badges{display:flex;gap:4px;flex-wrap:wrap;min-height:0}.bdg{font:500 11px "Pixelify Sans";padding:1px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}.bdg.bad{color:#ffb4a8;border-color:#7a3228;background:#2b1513}.bdg.ok{color:#bfe8b8;border-color:#386a32;background:#14240f}
.main{position:relative;min-height:0;display:flex}
#mapbox{position:relative;flex:1;min-width:0;overflow:hidden;background:#05070a;display:flex;align-items:center;justify-content:center}
#map{display:block;image-rendering:pixelated;touch-action:none;cursor:pointer}
#mini{position:absolute;right:8px;top:8px;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated;opacity:.92;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.zoom{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:8px;background:rgba(26,33,44,.85);border:1px solid var(--line);font:700 18px "Pixelify Sans"}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:rgba(26,33,44,.95);border:1px solid var(--gold);border-radius:99px;padding:6px 6px 6px 16px;display:flex;gap:10px;align-items:center;max-width:92%;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#banner{position:absolute;inset:auto 12px 12px;max-width:520px;margin:0 auto;background:rgba(21,27,36,.97);border:1px solid var(--acc);border-radius:var(--r);padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:3}
#banner h2{color:var(--acc);font-size:32px}#banner p{margin:4px 0;color:var(--ink2)}#banner ul{margin:8px 0 12px;padding-left:20px;font-size:15px}
.side{display:none}
.bottom{background:var(--bg2);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;flex-direction:column;gap:6px}
#quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.qs{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 6px;min-height:34px;font-size:12px;overflow:hidden;white-space:nowrap}.qs.empty{color:var(--mute);border-style:dashed}.qs canvas{flex:none}
#log{height:70px;overflow-y:auto;font-size:14px;line-height:1.3;padding:2px 4px;background:#0a0e14;border:1px solid var(--line);border-radius:7px;cursor:pointer;scrollbar-width:thin}
#log p{margin:1px 0}.hint{color:#9fb4c8}.good{color:var(--green)}.bad{color:#ff8f80}.warn{color:var(--gold2)}.say{color:#e9d9b0}.lore{color:var(--violet)}.roll{color:#8fa0b8;font-family:"Pixelify Sans";font-size:12px}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:3px}
.pad button{background:var(--panel);border:1px solid var(--line);border-radius:7px;font:700 15px "Pixelify Sans";color:var(--ink2)}.pad button:active{background:var(--gold);color:#000}
#here{background:#2a2618;border-color:#6a5420;color:var(--gold2);font-size:12px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.acts button{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:40px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:2px}
.acts button small{font:10px "Pixelify Sans";color:var(--mute)}.acts button.on{background:#20301c;border-color:var(--green);color:var(--green)}
#game.nodpad .ctrl{grid-template-columns:1fr}#game.nodpad .pad{display:none}
/* sheets */
#sheet{position:fixed;inset:0;background:rgba(5,7,10,.62);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .14s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheetbox{width:100%;max-width:640px;max-height:84vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:0 16px calc(16px + var(--safe-b));animation:up .18s;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheethd{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;background:var(--panel);z-index:1;border-bottom:1px solid var(--line);margin-bottom:10px}
.sheethd h3{font-size:28px;color:var(--gold2);line-height:1}.closex{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink2);font-size:14px}
.sheettxt{color:var(--ink2);margin:6px 0}
.say{display:flex;flex-direction:column;gap:2px;background:#221d14;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0}.say b{font:500 12px "Pixelify Sans";color:var(--gold);letter-spacing:.06em;text-transform:uppercase}.say span{color:#f1e3c2;font-size:17px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 14px;min-height:46px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--gold);background:#2a3242}.opt small{color:var(--mute);font-size:13px;margin-top:2px}.opt[disabled]{opacity:.42;cursor:default}
.opt.pri{border-color:#6a5420;background:#2a2618}.opt.pri span{color:var(--gold2)}.opt.bad span{color:#ff9c8e}.opt.ghost{background:none;border-style:dashed}
.pack h4,.char h4{font:500 12px "Pixelify Sans";letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:16px 0 6px}
.pack .opt{margin-bottom:5px;width:100%}
.statrow{display:grid;grid-template-columns:110px 1fr 36px auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #263040;font-size:15px}.statrow b{text-align:right;font-family:"Pixelify Sans"}
.pips{display:flex;gap:3px}.pips i{width:11px;height:11px;border-radius:2px;background:#2a3342}.pips i.on{background:var(--gold)}
.small{font-size:14px;color:var(--ink2);margin:4px 0}.rep{color:var(--ink2);font-size:14px}
.charhd{display:flex;gap:14px;align-items:center;margin-bottom:8px}.portrait{width:64px;height:64px;image-rendering:pixelated;background:#0a0e14;border:1px solid var(--line);border-radius:8px}
.qline{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #263040}.qline b{font:500 11px "Pixelify Sans";color:var(--gold);padding-top:3px}.qline.done b{color:var(--green)}.qline small{display:block;color:var(--mute);font-size:13px}.qline.done span{text-decoration:line-through;color:var(--mute)}
.alm{background:var(--panel2);border-radius:8px;padding:8px 12px;margin:6px 0}.alm.cur{border:1px solid var(--acc)}.alm h4{margin:0 0 4px}.alm ul{margin:4px 0;padding-left:18px;font-size:14px;color:var(--ink2)}
.fulllog p{margin:3px 0;font-size:15px}
.mapwrap{overflow:auto;max-height:66vh;border-radius:8px;border:1px solid var(--line);background:#0a0e14}.worldmap{display:block;image-rendering:pixelated}
.forge{display:flex;flex-direction:column;gap:10px}.preview{background:#0a0e14;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;font-size:15px;color:var(--ink2)}.preview b{color:var(--gold2)}
.fxrow{background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}.fxd{color:var(--mute)}.rng{display:flex;flex-direction:column;font-size:14px;color:var(--ink2)}.rng input{accent-color:var(--gold)}
/* end */
#end{background:radial-gradient(ellipse at 50% 0,#2a1a14,#0d1117 70%)}.endin{max-width:640px;margin:0 auto;text-align:center}.eyebrow{font:500 13px "Pixelify Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-top:30px}
#end h1{font-size:clamp(40px,9vw,64px);color:var(--gold2)}.lead{font-size:19px;color:var(--ink2)}.rate{color:var(--green)}#end ol{text-align:left;background:var(--panel);border-radius:var(--r);padding:14px 14px 14px 34px;margin:14px 0}#end ol li{margin:4px 0}#end ol small{color:var(--acc);font-family:"Pixelify Sans"}
#end dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 24px}#end dt{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}#end dd{margin:0 0 8px;font:700 22px "Pixelify Sans"}
/* desktop */
@media (min-width:900px){
 #game{grid-template-rows:auto 1fr;grid-template-columns:1fr 360px}.hud{grid-column:1/-1}
 .hud{flex-direction:row;align-items:center;gap:14px;padding:8px 14px}.meters{grid-template-columns:repeat(6,minmax(90px,130px));flex:none}.mt{height:24px}.mt b{line-height:22px;font-size:12px}.info{flex:1;font-size:14px}#badges{max-width:28%}
 .bottom{border-top:0;border-left:1px solid var(--line);padding:12px;gap:10px;overflow:hidden}
 #log{flex:1;height:auto;font-size:15px}
 .pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
 .acts{grid-template-columns:repeat(2,1fr)}.acts button{flex-direction:row;gap:8px;justify-content:flex-start;padding:0 12px}
 #quick{grid-template-columns:repeat(2,1fr)}
 .ctrl{grid-template-columns:auto 1fr}
 #sheet{align-items:center}.sheetbox{border-radius:16px;border-bottom:1px solid var(--line);max-height:86vh}
 .main{grid-row:2;grid-column:1}.bottom{grid-row:2;grid-column:2;min-height:0}
}
@media (max-width:899px){ .main{grid-row:2} .bottom{grid-row:3} }
@media (max-height:640px) and (max-width:899px){#log{height:48px}.pad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function firstOnLine(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0;while(!(x===x1&&y===y1)){const e2=2*e;if(e2>-dy){e-=dy;x+=sx}if(e2<dx){e+=dx;y+=sy}const t=at(x,y);if(t&&!isP(t))return t;const d=tdef(x,y);if(d.boom)return{barrel:1,x,y};if(d.o&&!(x===x1&&y===y1))return{wall:1,x,y}}return null}
function doShoot(x,y){const p=G.p,w=canShoot();if(!w)return;if(w.gun){if(!p.loaded&&!w.norld){msg('Reload first.','warn');return}if(w.norld&&!hasItem('shot')){msg('You are out of shot.','warn');return}if(w.norld)takeItem('shot');p.loaded=false;if((raining()&&outdoors(p.x,p.y)||p.fx.wet)&&chance(.3)){msg('Damp powder. The gun only fizzes.','warn');advance(100);return}}else if(w.usesStone){if(!hasItem('stone')){msg('You need stones for a sling.','warn');return}takeItem('stone')}else if(w.bow){if(!hasItem('arrow')){msg('You have no arrows.','warn');return}takeItem('arrow')}
 const hit=firstOnLine(p.x,p.y,x,y);RT.fxq.push({type:'shot',x:p.x,y:p.y,x2:x,y2:y});if(w.gun&&w.ench!=='silence'){noise(p.x,p.y,14,'p');if(L.world&&biomeKey(p.x,p.y)==='mountain'&&seasonIdx()===3&&chance(.35))avalanche(p.x,p.y)}else noise(p.x,p.y,3,'p');
 if(hit&&hit.barrel){msg('The shot finds the powder barrel.','warn');tset(hit.x,hit.y,'rubble');explode(hit.x,hit.y,3,p)}else if(hit&&!hit.wall){const t=hit;const pct=shootPct(t);if(unaware(t)&&SP[t.s].tags.person&&!hostile(t,p))crime('murder',t);if(chance(pct/100)){let dm=(w.d||3)+ri(0,Math.floor(eff('agi')/2))-(SP[t.s].ar||0);if(unaware(t))dm=Math.round(dm*1.5);msg('Your shot hits '+cname(t)+' for '+dm+'.','');applyEnch(w,t);if(w.ench==='leech')p.hp=Math.min(p.mh,p.hp+Math.ceil(dm/2));hurt(t,Math.max(1,dm),p,w.ench==='mercy'?'mercy':'gunshot');if(w.bow&&chance(.5))addItem(L,t.x,t.y,mk('arrow'))}else{msg('Your shot misses.','');t.alert=2;if(w.bow&&chance(.6))addItem(L,x,y,mk('arrow'))}}else{const dd=tdef(x,y);if(w.gun&&dd.f&&chance(.1))ignite(x,y,1)}advance(100)}
function doReload(){const p=G.p,w=canShoot();if(!w||!w.gun)return;if(p.loaded){msg('Already loaded.','hint');return}if(!takeItem('shot')){msg('You have no powder and shot.','warn');return}p.loaded=true;msg('You ram home a charge.','');advance(120)}
// ===== SPELLS =====
function mindResisted(t,power){const d=SP[t.s];if(t.aegis)return true;if(d.tags.mindless&&!d.tags.undead)return true;if(d.tags.construct||d.tags.ship)return true;const ch=clamp(power*9-t.mh*.4+30,8,97);return !chance(ch/100)}
function castSpell(s,c,x,y){const pl=isP(c);const pw=pl?eff('int'):5;const t=at(x,y);const name=pl?'You':cname(c);RT.fxq.push({type:'bolt',x:c.x,y:c.y,x2:x,y2:y,s});if(!pl&&(visible(c.x,c.y)||(t&&isP(t))))msg(name+' casts '+SPELLS[s].n+'!','warn');
 switch(s){
 case'firebolt':{if(t){t.burning=Math.max(t.burning||0,4);if(!isP(t))t.fireBy=pl?1:0;hurt(t,5+pw,c,'fire')}ignite(x,y,pl?1:0);if(tdef(x,y).icy)meltTile(x,y);if(tdef(x,y).water&&!t)addGas(x,y,'steam',4);const v=vesselAt(x,y);if(v){v.hp-=5;checkSink(v)}noise(x,y,6,pl?'p':null);break}
 case'frost':{if(t){hurt(t,3+(pw>>1),c,'frost');if(!isP(t))t.slow=8;t.burning=0}for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){freezeTile(x+dx,y+dy,40);delete L.fire[IX(x+dx,y+dy)]}break}
 case'shock':shockFrom(x,y,4+pw,c,t);break;
 case'heal':if(pl){c.hp=Math.min(c.mh,c.hp+8+pw*2);msg('Warmth knits your wounds.','good')}break;
 case'sleep':if(t){if(isP(t)){if(!chance((eff('int')*8+10)/100)){msg('Your eyelids slam shut.','bad');RT.forceWait=3}else msg('You shake off the sleep spell.','good')}else if(!SP[t.s].tags.undead&&!mindResisted(t,pw)){t.sleep=24;t.ko=1;if(pl)msg(cname(t)+' sinks to the ground.','good')}else if(pl)msg(cname(t)+' resists.','warn')}break;
 case'charm':if(t){if(isP(t)){if(!chance((eff('int')*8+10)/100))p_dom(5)}else if(pl){if((SP[t.s].tags.animal||t.mh<=15)&&!mindResisted(t,pw)){t.charm=70;t.alert=0;delete t.grudge;msg(cname(t)+' looks at you with sudden devotion.','good');gainXP(3)}else msg('It does not take.','warn')}else if(!mindResisted(t,3)){t.mindfac=c.fac;t.mindT=25;t.alert=0}}break;
 case'fear':if(t){if(isP(t)){if(!chance((eff('int')*7+10)/100))p_dom(3)}else if(!mindResisted(t,pw)||!SP[t.s].tags.brave){t.fear=12;if(pl)msg(cname(t)+' flees in terror.','good')}}break;
 case'brainwash':if(t){if(isP(t)){if(!chance((eff('int')*7+5)/100)){p_dom(8);msg(name+' reaches into your mind!','bad');story(name+' seized your mind.',2)}else msg('You push '+name+' out of your head.','good')}else if(pl){if(t.id===G.kingId&&!t.aegis&&!mindResisted(t,pw)){msg('The king\'s eyes go flat. He belongs to you now.','story');endGame('puppet');return}if(SP[t.s].tags.person&&!mindResisted(t,pw)){t.charm=45;t.mindOld=t.fac;t.alert=0;t.grudge={};delete t.truce;msg(cname(t)+' turns to look at its friends. It is smiling.','good');story('Brainwashed '+SP[t.s].n+' into fighting its own kin.',2);G.stats.brainwash++;gainXP(6);crime('mind-theft',t)}else msg(cname(t)+' resists.','warn')}else if(!mindResisted(t,4)&&!t.aegis){t.mindfac=c.fac;t.mindT=30;t.alert=0;t.grudge={};if(visible(x,y))msg(cname(t)+' turns on its own side.','warn')}}break;
 case'raise':raiseAt(x,y,c);break;
 case'blink':if(pl){if(tdef(x,y).p&&!at(x,y)){c.x=x;c.y=y;msg('Space folds. You are elsewhere.','good')}}else{const q=findTile(c,5,(dd,a,b)=>dd.p&&!at(a,b));if(q)moveC(c,q.x,q.y)}break;
 case'gust':{for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;if(L.gas[IX(nx,ny)])delete L.gas[IX(nx,ny)];const e=at(nx,ny);if(e&&e!==c)pushEnt(e,c.x,c.y,3,c);if(L.fire[IX(nx,ny)]&&chance(.5)){delete L.fire[IX(nx,ny)];const w=pick(DIRS);ignite(nx+w[0]*2,ny+w[1]*2,pl?1:0)}}if(pl&&G.p.aboard){G.wind={dx:Math.sign(x-c.x),dy:Math.sign(y-c.y)};msg('Your sails fill.','good')}noise(x,y,5,pl?'p':null);break}
 case'waterwalk':if(pl){c.fx.waterwalk={t:30+pw*4};msg('The water firms under your feet.','good')}break;
 case'summon':if(pl){const bk=biomeKey(c.x,c.y);const tab=(WILD[bk]||WILD.forest).filter(([s])=>SP[s].tags.predator||SP[s].tags.territorial);const sp=tab.length?wpick(tab):'wolf';const q=passableSpot(c.x,c.y,2);if(q){const z=spawn(sp,q.x,q.y,{ally:1,life:120});msg('A '+SP[sp].n.toLowerCase()+' answers your call.','good')}}break;
 }}
function p_dom(n){G.p.dom=Math.max(G.p.dom,n);msg('Your body stops obeying you.','bad')}
function pushEnt(e,fx,fy,n,src){const dx=Math.sign(e.x-fx)||0,dy=Math.sign(e.y-fy)||0;for(let i=0;i<n;i++){const nx=e.x+dx,ny=e.y+dy;const d=tdef(nx,ny);if(!inb(L,nx,ny)||at(nx,ny)||(!d.p&&!d.swim)){if(i>0)hurt(e,3,src,'impact');return}if(isP(e)){e.x=nx;e.y=ny}else{RT.occ.delete(IX(e.x,e.y));e.x=nx;e.y=ny;RT.occ.set(IX(nx,ny),e)}if(d.swim&&!isP(e)&&!SP[e.s].tags.flier&&!SP[e.s].tags.swimmer&&!SP[e.s].tags.sea){if(visible(nx,ny))msg(cname(e)+' is thrown into deep water.','good');hurt(e,e.hp+1,src,'fall');return}if(d.lava&&!isP(e)){hurt(e,e.hp+1,src,'fire');return}if(d.trap&&!isP(e))trap(e,nx,ny)}}
function shockFrom(x,y,dm,c,t){const seen=new Set(),hit=[];seen.add(IX(x,y));const q=[[x,y]];let h=0;while(h<q.length&&seen.size<60){const[a,b]=q[h++];const e=at(a,b);if(e&&e!==c&&!hit.includes(e))hit.push(e);for(const[dx,dy]of DIRS){const nx=a+dx,ny=b+dy;if(!inb(L,nx,ny))continue;const k=IX(nx,ny);if(seen.has(k))continue;const dd=tdef(nx,ny);const oc=at(nx,ny);if(dd.water||dd.swim||(oc&&(oc.wet>0||(isP(oc)&&oc.fx.wet)))||tdef(a,b).water&&oc){seen.add(k);q.push([nx,ny])}}}if(t&&!hit.includes(t))hit.push(t);RT.fxq.push({type:'burst',x,y,e:'shock'});hit.forEach(e=>{const wet=isP(e)?!!e.fx.wet:e.wet>0;hurt(e,wet?dm*2:dm,c,'lightning');if(!isP(e))e.stun=1;if(visible(e.x,e.y))msg('Lightning arcs through '+(isP(e)?'you':cname(e))+'!',isP(e)?'bad':'good')});if(hit.length>2&&isP(c))story('One bolt of lightning ran through '+hit.length+' creatures in the water.',2);noise(x,y,8,isP(c)?'p':null)}
function raiseAt(x,y,c){const k=IX(x,y),its=L.items[k];if(!its)return false;const cp=its.find(i=>i.k==='corpse');if(!cp)return false;its.splice(its.indexOf(cp),1);if(!its.length)delete L.items[k];const sp=SP[cp.sp]||SP.villager;const z=spawn('undeadthrall',x,y,{life:isP(c)?300:0,fac:isP(c)?'player':c.fac,ally:isP(c)?1:0,mh:Math.max(8,sp.hp*.7|0),hp:Math.max(8,sp.hp*.7|0),wild:1});z.origin=cp.sp;if(visible(x,y))msg(sp.n+' corpse lurches upright.',isP(c)?'good':'warn');if(isP(c)){G.stats.raised++;gainXP(4);story('Raised a '+sp.n+' from the dead.',2);crime('necromancy',{fac:'free'})}return true}
function spellCost(e){let c=0;(e.fx||[]).forEach(f=>{const d=EFFECTS[f.e];c+=d.c*f.mag*(1+f.area*.8)*(1+f.dur/15)});return Math.max(1,Math.round(c/(1+eff('int')*.07)))}
function customCost(sp){return spellCost(sp)}
function targetsIn(x,y,r){const o=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.hypot(dx,dy)>r+.4)continue;const e=at(x+dx,y+dy);if(e)o.push(e)}return o}
function castCustom(sp,x,y){const p=G.p;const cost=customCost(sp);if(p.mp<cost){const blood=cost-p.mp;if(p.hp<=blood){msg('Casting this now would kill you.','bad');return false}p.mp=0;p.hp-=blood;msg('You pay the difference in blood: '+blood+' health.','bad')}else p.mp-=cost;RT.fxq.push({type:'bolt',x:p.x,y:p.y,x2:x,y2:y,s:'custom'});msg('You cast '+sp.name+'.','good');sp.fx.forEach(f=>applyEffect(f.e,f.mag,f.area,f.dur,p,x,y));noise(x,y,6,'p');advance(100);return true}
function applyEffect(e,mag,area,dur,c,x,y){const p=G.p,def=EFFECTS[e];const tg=def.t==='self'?[p]:targetsIn(x,y,area);const each=fn=>tg.forEach(t=>{if(t!==c||def.t==='self')fn(t)});const tiles=fn=>{for(let dy=-area;dy<=area;dy++)for(let dx=-area;dx<=area;dx++){if(Math.hypot(dx,dy)>area+.4)continue;fn(x+dx,y+dy)}};
 switch(e){case'fire':each(t=>{hurt(t,mag,c,'fire');if(t.hp>0){t.burning=Math.max(t.burning||0,dur+1);if(!isP(t))t.fireBy=1}});tiles((a,b)=>ignite(a,b,1));break;
 case'frost':each(t=>{hurt(t,mag,c,'frost');if(!isP(t))t.slow=dur+3});tiles((a,b)=>freezeTile(a,b,dur*3+30));break;case'shock':shockFrom(x,y,mag,c,at(x,y));each(t=>{if(!isP(t))t.stun=Math.max(t.stun||0,Math.min(3,dur))});break;
 case'poison':each(t=>{if(!isP(t)){t.poison=Math.max(t.poison||0,dur+mag);t.poisonBy='p'}else poisonEnt(t,dur)});break;case'drain':{let g=0;each(t=>{hurt(t,mag,c,'drain');g+=mag});p.hp=Math.min(p.mh,p.hp+g);break}
 case'heal':p.hp=Math.min(p.mh,p.hp+mag);if(area>0)RT.act.forEach(o=>{if(dist(o.x,o.y,p.x,p.y)<=area&&(o.ally||o.charm>0))o.hp=Math.min(o.mh,o.hp+mag)});break;case'restore':p.hunger=clamp(p.hunger+mag,0,100);p.thirst=clamp(p.thirst+mag,0,100);if(mag>=25){p.dz=[];msg('Every sickness leaves your body.','good')}break;
 case'haste':p.fx.haste={v:Math.ceil(mag/6),t:dur+1};msg('Everything else slows down.','good');break;case'might':p.fx.might={v:Math.ceil(mag/6),t:dur+1};recalc();msg('Strength floods your arms.','good');break;case'invis':p.fx.invis={t:dur+1};msg('You fade from sight.','good');break;case'aegis':p.fx.absorb={v:mag*2,t:dur+1};msg('A ward shimmers around you.','good');break;case'waterwalk':p.fx.waterwalk={t:dur*3+10};msg('The water firms under you.','good');break;
 case'timestop':p.fx.tstop={t:Math.max(1,dur)};msg('The world holds its breath.','story');story('Stopped time.',3);break;
 case'sleep':each(t=>{if(isP(t))return;if(!t.aegis&&!SP[t.s].tags.undead&&!SP[t.s].tags.mindless&&(mag*3>=t.mh*.5||!mindResisted(t,mag/3))){t.sleep=dur*2+8;t.ko=1;G.stats.knockouts++;msg(cname(t)+' collapses asleep.','good')}});break;
 case'calm':each(t=>{if(isP(t)||t.aegis)return;if(mag*3>=t.mh*.5||!mindResisted(t,mag/3)){t.truce=G.turn+dur*3+15;t.alert=0;delete t.grudge;t.confused=0;msg(cname(t)+' lowers its guard.','good')}});break;case'fear':each(t=>{if(!isP(t)&&!t.aegis)t.fear=dur+4});break;
 case'charm':each(t=>{if(isP(t)||t.aegis)return;if(t.id===G.kingId){msg('The king\'s eyes go flat.','story');endGame('puppet');return}if(mag*3>=t.mh*.6||!mindResisted(t,mag/3)){t.charm=dur*3+15;t.alert=0;t.grudge={};if(SP[t.s].tags.person)t.mindOld=t.fac;msg(cname(t)+' now serves you.','good');G.stats.brainwash++}});break;
 case'paralyze':each(t=>{if(!isP(t)&&!t.aegis)t.para=dur+1});break;case'confuse':each(t=>{if(!isP(t)&&!t.aegis)t.confused=dur+3});break;
 case'quake':noise(x,y,20,'p');if(L.world&&biomeKey(x,y)==='mountain'&&seasonIdx()===3)avalanche(x,y);tiles((a,b)=>{const d=tdef(a,b);if((d.wall||d.door||d.k==='rock'||d.gate||d.k==='cavewall'||d.k==='redrock')&&!d.seal){if(chance(mag/40+.25)){tset(a,b,'rubble');if(d.gate)msg('The gate buckles and falls.','warn')}}else if(d.chop){if(chance(.5))tset(a,b,'stump')}else if(d.p&&chance(.2)&&!d.water)tset(a,b,'pit');const o=at(a,b);if(o)hurt(o,Math.ceil(mag/3),c,'quake')});break;
 case'inferno':tiles((a,b)=>{if(!ignite(a,b,1)&&tdef(a,b).p&&!tdef(a,b).water)L.fire[IX(a,b)]={t:dur+3,o:1}});story('Set the land ablaze with a word.',2);break;case'deepfreeze':tiles((a,b)=>{freezeTile(a,b,dur*3+60);delete L.fire[IX(a,b)];const o=at(a,b);if(o&&!isP(o)){o.para=Math.min(6,dur);o.burning=0}});break;
 case'rain':G.wx={k:'storm',t:dur*4+25};msg('Clouds pile up from nowhere.','wx');break;case'growth':tiles((a,b)=>{const d=tdef(a,b),k=IX(a,b);if(L.crops[k])L.crops[k].a=200;else if(['grass','ash','stump','sand','mud','scree','savgrass','steppegrass','moss'].includes(d.k)&&!at(a,b)&&chance(.55))tset(a,b,chance(.4)?'tree':'vines')});msg('The ground heaves with green.','good');break;
 case'teleport':if(tdef(x,y).p&&!at(x,y)){p.x=x;p.y=y;msg('You step through the air.','good')}break;case'raiseall':tiles((a,b)=>raiseAt(a,b,p));break;
 case'tidal':tiles((a,b)=>{const d=tdef(a,b);if(d.p&&!d.indoor&&!d.wall&&chance(.6))tset(a,b,'flood');const o=at(a,b);if(o&&!isP(o)){pushEnt(o,x,y,2,c);hurt(o,Math.ceil(mag/2),c,'wave');o.wet=10;delete L.fire[IX(a,b)]}});msg('A wall of water crashes down.','good');break;}}
function playerCast(s,x,y){const p=G.p;const d=SPELLS[s];if(p.mp<d.mp){msg('Not enough mana.','warn');return false}if(!d.self&&dist(p.x,p.y,x,y)>d.rng){msg('Out of range.','warn');return false}if(!d.self&&!los(p.x,p.y,x,y)&&s!=='blink'){msg('No line of sight.','warn');return false}if(s==='raise'&&!(L.items[IX(x,y)]||[]).some(i=>i.k==='corpse')){msg('There is no corpse there.','warn');return false}p.mp-=d.mp;const t=at(x,y);if(t&&!isP(t)&&SP[t.s].tags.person&&!hostile(t,p)&&['firebolt','shock','frost'].includes(s))crime('assault',t);castSpell(s,p,x,y);if(p.fx.invis)delete p.fx.invis;advance(100);return true}
function doThrow(it,x,y){const p=G.p,d=idef(it);if(dist(p.x,p.y,x,y)>7){msg('Too far to throw.','warn');return}const q=mk(it.k,1);if(it.sp)q.sp=it.sp;if(it.x)q.x=it.x;if((it.q||1)>1)it.q--;else{if(p.eq.w===it)p.eq.w=null;if(p.eq.a===it)p.eq.a=null;p.inv.splice(p.inv.indexOf(it),1)}RT.fxq.push({type:'shot',x:p.x,y:p.y,x2:x,y2:y});if(d.effect){msg('You throw '+d.n.toLowerCase()+'.','');const t=at(x,y);if(d.effect==='noise'&&t&&!isP(t)){hurt(t,2,p,'stone');msg('The stone cracks against '+cname(t)+'.')}throwEffect(d.effect,x,y,p);if(d.effect!=='noise'&&t&&!isP(t)&&SP[t.s].tags.person&&!hostile(t,p))crime('assault',t);if(d.effect==='noise')addItem(L,x,y,mk('stone'))}else{addItem(L,x,y,q);msg(d.n+' lands nearby.','');noise(x,y,4)}advance(100)}

function useItem(it){const p=G.p,d=idef(it);if(d.k==='wpn'||d.k==='arm'){if(d.req){for(const s in d.req)if(p.st[s]<d.req[s]){msg('You need '+STATN[s]+' '+d.req[s]+' for that.','warn');return}}if(d.k==='wpn'){p.eq.w=p.eq.w===it?null:it;msg((p.eq.w?'You wield ':'You put away ')+d.n+'.')}else{p.eq.a=p.eq.a===it?null:it;msg((p.eq.a?'You wear ':'You take off ')+d.n+'.');if(p.eq.a&&d.disg)msg('Dressed as the '+FAC[d.disg].n+'. They won\'t look twice unless you act strangely.','hint')}recalc();advance(60);return}
 if(d.k==='food'||d.k==='drink'||d.k==='med'&&!d.spike){if(d.hun)p.hunger=clamp(p.hunger+d.hun,0,100);if(d.thi)p.thirst=clamp(p.thirst+d.thi,0,100);if(d.hp)p.hp=Math.min(p.mh,p.hp+d.hp);if(d.mp)p.mp=Math.min(p.mmp,p.mp+d.mp);if(d.warm)p.fx.warm={t:d.warm};if(d.cool)p.fx.cool={t:d.cool};if(d.breath)p.fx.gills={t:120};if(d.boost){p.fx.boost={k:d.boost,v:2,t:80};recalc();msg('Your '+STATN[d.boost]+' rises.','good')}if(d.cure){const n=cureWith(['tonic']);delete p.fx.poison;msg(n?'The sickness loosens and leaves you.':(p.dz.length?'It helps a little, but this sickness needs a different remedy.':'It tastes bitter and clean.'),n?'good':'hint')}if(isVamp()&&(d.k==='food')){msg('It turns to ash in your mouth. Only blood feeds you now.','bad');takeItem(it.k);advance(70);return}if(d.raw&&chance(p.herb?.08:d.fish?.15:.3))infect(p,'rot');if(d.dirty&&chance(.35))infect(p,chance(.5)?'dysentery':'rot');if(d.risky&&chance(p.herb?.05:.2)){p.fx.poison={t:6};msg('That mushroom was a mistake.','bad')}if(d.fish&&!d.raw||it.k==='berries'||it.k==='coconut')p.dz=p.dz.filter(z=>z.k!=='scurvy'||chance(.5));msg('You '+(d.k==='drink'?'drink':d.k==='med'?'use':'eat')+' '+d.n.toLowerCase()+'.');const emp=d.empty;takeItem(it.k);if(emp)giveItem(mk(emp),true);advance(70);return}
 if(d.k==='scroll'){const s=it.sp;const sd=SPELLS[s];if(!sd){msg('The words are too faded.','warn');return}if(eff('int')<sd.int){msg('You need Intelligence '+sd.int+' to learn this.','warn');return}if(p.spells.includes(s)){msg('You already know this. You grind it into dust.','hint');giveItem(mk('dust'),true)}else{p.spells.push(s);msg('You learn '+sd.n+'.','good');gainXP(10)}p.inv.splice(p.inv.indexOf(it),1);advance(100);return}
 if(d.lore){learnLore(d.lore);return}if(it.k==='potion'||it.k==='brew'){drinkPotion(it);return}if(REAGENTS.includes(it.k)&&d.k==='herb'){tasteReagent(it);return}if(it.k==='suncell'){if(!augOn()){msg('You have no augments to charge.','hint');return}p.charge=Math.min(100,(p.charge||0)+40);takeItem('suncell');msg('The cell flares and your augments drink it in.','good');advance(60);return}if(it.k==='augkit'){msg('An augment kit. An artificer could install this for you.','hint');return}if(it.k==='letter'){msg('A letter, sealed. Deliver it.','hint');return}
 if(it.k==='treasuremap'){if(!it.tx){const c=pick(G.conts.filter(q=>q.real));let tx,ty;for(let i=0;i<60;i++){tx=c.cx0+ri(30,(c.cw||CELL)-30);ty=c.cy0+ri(30,(c.ch||CELL)-30);const tb=terrainAt(tx,ty);if(TDEF[TN[tb&255]].p&&!TDEF[TN[tb&255]].water)break}it.tx=tx;it.ty=ty;it.cname=c.name}msg('The map shows an X on '+it.cname+', near '+compass(it.tx-p.x,it.ty-p.y)+'. Dig there with a shovel.','hint');G.marks.push({x:it.tx,y:it.ty,t:'X marks the spot'});return}
 if(it.k==='torch'){if(p.torch>0){msg('Your torch is already lit.','hint');return}takeItem('torch');p.torch=90;msg('You light a torch.','good');advance(40);return}
 if(it.k==='spyglass'){p.fx.spy={t:1};computeFOV();msg('You sweep the horizon with the spyglass.','good');const near=G.bands.filter(b=>dist(b.x,b.y,p.x,p.y)<60);near.slice(0,4).forEach(b=>msg('You spot '+bandDesc(b)+' to the '+compass(b.x-p.x,b.y-p.y)+'.','hint'));advance(60);return}
 if(it.k==='chalk'){if(tdef(p.x,p.y).p&&!tdef(p.x,p.y).water){takeItem('chalk');tset(p.x,p.y,'sigil');msg('You draw a warding sigil. Beasts and the dead will not strike you while you stand on it.','good');advance(100)}return}
 if(d.k==='herb'&&it.k==='bloodmoss'&&p.herb){p.hp=Math.min(p.mh,p.hp+6);takeItem(it.k);msg('You chew the moss.','good');advance(70);return}
 msg('You cannot use that directly. Try throwing it, crafting with it, or giving it to someone.','hint')}
function bandDesc(b){const m=b.members.filter(x=>!x.dead);const s=SP[m[0].s];if(b.kind==='seamonster'||b.kind==='monster'||b.kind==='herd')return(m.length>1?m.length+' ':'a ')+s.n.toLowerCase()+(m.length>1?'s':'');if(b.ship)return(b.fac==='pirate'?'a pirate ':'a ')+s.n.toLowerCase();return(b.fac==='horde'?'a Horde ':b.fac==='plague'?'a plague swarm of ':b.nation!=null?'a '+G.nations[b.nation].short+' ':'a ')+(b.kind==='caravan'?'caravan':b.kind==='swarm'?m.length+' walkers':'company of '+m.length)}
function dropItem(it){const p=G.p;const q=Object.assign({},it);if(p.eq.w===it)p.eq.w=null;if(p.eq.a===it)p.eq.a=null;p.inv.splice(p.inv.indexOf(it),1);addItem(L,p.x,p.y,q);msg('You drop '+iname(q)+'.');if(idef(q).meat&&!p.sneak)msg('The smell of meat drifts on the wind.','hint');advance(40)}
function foodList(){return G.p.inv.filter(i=>idef(i).k==='food'||idef(i).k==='bait')}
function pickupAll(x,y){const k=IX(x,y),its=L.items[k];if(!its)return;for(const it of its.slice()){if(it.k==='corpse')continue;if(it.k==='relic'&&nearSite(x,y,2)&&nearSite(x,y,2).type==='shrine'&&RT.act.some(c=>c.role==='priest'&&visible(c.x,c.y)))crime('theft',{fac:'free'});if(giveItem(it))its.splice(its.indexOf(it),1)}if(!its.length)delete L.items[k];advance(50)}
function butcher(x,y){const k=IX(x,y),its=L.items[k];if(!its)return;const c=its.find(i=>i.k==='corpse');if(!c)return;its.splice(its.indexOf(c),1);if(!its.length)delete L.items[k];const sp=SP[c.sp];if(sp&&!sp.tags.person){Object.entries(sp.loot||{}).forEach(([m,q])=>addItem(L,x,y,mk(m,ri(1,q))));addItem(L,x,y,mk('rawmeat',1))}addItem(L,x,y,mk('bone',1));if(c.dz==='zombie'&&chance(.6)){addItem(L,x,y,mk('bile',1));msg('You drain a vial of grey bile. Handle with care.','warn')}if(c.dz&&chance(.3))infect(G.p,c.dz==='cough'?'cough':'rot');msg('You butcher the corpse.','');if(sp&&sp.tags.person){crime('desecration',{fac:'free'});msg('It is grim work.','warn')}advance(200)}
function sleepRest(bed){const p=G.p;let n=bed?40:15;msg(bed?'You lie down to sleep.':'You rest.','hint');for(let i=0;i<n&&!G.over;i++){const danger=RT.act.some(c=>hostile(c,p)&&dist(c.x,c.y,p.x,p.y)<=7&&c.sleep<=0&&c.alert>=1&&visible(c.x,c.y));if(danger&&i>0){msg('Something wakes you!','bad');break}advance(100);if(RT.hit){RT.hit=0;msg('You wake up hurt!','bad');break}if(i%3===0)p.hp=Math.min(p.mh,p.hp+(bed?2:1));p.mp=Math.min(p.mmp,p.mp+(bed?1:0))}if(bed)msg('You wake.','')}
// ===== CRAFT / FORGE / SPELLMAKING =====
function craftAvail(r){if(r.near==='cook'&&!nearHeatT())return false;if(r.near==='forge'&&!nearForge())return false;return Object.entries(r.need).every(([k,q])=>count(k)>=q)}
function nearHeatT(){const p=G.p;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(tdef(p.x+dx,p.y+dy).cook||L.fire[IX(p.x+dx,p.y+dy)])return true}return false}
function nearForge(){const p=G.p;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(tdef(p.x+dx,p.y+dy).forge)return true;return false}
function nearSpellforge(){const p=G.p;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(tdef(p.x+dx,p.y+dy).arcane)return true;return false}
function doCraft(r){if(!craftAvail(r))return;Object.entries(r.need).forEach(([k,q])=>takeItem(k,q));giveItem(mk(r.out,r.q||1),true);msg('You make '+iname(mk(r.out,r.q||1))+'.','good');G.stats.crafted++;gainXP(1);advance(r.near?150:100)}
function forgeCost(b,m,e){const B=FBASE[b],M=FMAT[m],E=FENCH[e];return{mat:M.it,matq:Math.max(1,B.cost),wood:B.kind==='wpn'?1:0,dust:E.dust}}
function canForge(b,m,e){const c=forgeCost(b,m,e);return count(c.mat)>=c.matq&&count('wood')>=c.wood&&count('dust')>=c.dust}
function doForge(b,m,e){if(!nearForge()){msg('Stand beside a forge.','warn');return}if(!canForge(b,m,e)){msg('You lack the materials.','warn');return}const B=FBASE[b],M=FMAT[m],E=FENCH[e],c=forgeCost(b,m,e);takeItem(c.mat,c.matq);if(c.wood)takeItem('wood',c.wood);if(c.dust)takeItem('dust',c.dust);const skill=eff('str')+(G.p.forge||0)*2;const qual=Math.min(3,Math.floor(skill/5)+(chance(.3)?1:0));const qn=['Crude ','','Fine ','Masterwork '][qual];const x={k:B.kind,st:B.st,req:B.req?Object.assign({},B.req):undefined,v:Math.round((30+B.cost*10)*M.mult),noisy:B.noisy,quiet:B.quiet,mercy:B.mercy,manaP:B.manaP?Math.round(B.manaP*M.mult):undefined,warm:B.warm,chop:B.chop,gun:B.gun,norld:B.norld,rng:B.rng,bow:B.bow,lance:B.lance};if(M.light&&x.req)Object.keys(x.req).forEach(k=>x.req[k]=Math.max(1,x.req[k]-1));if(B.kind==='wpn')x.d=Math.round(B.d*M.mult)+qual-1;else x.ar=Math.round(B.ar*M.mult)+Math.max(0,qual-1);if(e!=='none'){x.ench=e;if(e==='mercy')x.mercy=1;if(e==='silence')x.quiet=1}x.n=qn+M.n+' '+B.n+(e!=='none'?' of '+E.n:'');Object.keys(x).forEach(k=>x[k]===undefined&&delete x[k]);const it={k:'forged',q:1,x};G.p.inv.push(it);msg('You forge '+x.n+'.','good');story('Forged '+x.n+'.',1);G.stats.crafted++;gainXP(6);noise(G.p.x,G.p.y,6,'p');advance(300);return it}
function makeSpell(name,fx){const p=G.p;const sp={id:'c'+(++G.cid),name:name||'Unnamed Working',fx};const c=spellCost(sp);const dust=Math.max(1,Math.ceil(c/18));if(!nearSpellforge()){msg('You need a spellforge.','warn');return null}if(count('dust')<dust){msg('This working needs '+dust+' arcane dust.','warn');return null}if(p.st.int+p.lvl<Math.min(12,1+Math.ceil(c/12))){msg('Beyond your skill. Lower magnitude, area, or duration.','warn');return null}takeItem('dust',dust);p.custom.push(sp);msg('You inscribe '+sp.name+'. It costs '+c+' mana.','good');story('Invented the spell '+sp.name+'.',2);G.stats.spellsMade++;gainXP(12);advance(300);return sp}
// ===== WORLD VERBS =====
function digTile(x,y){const d=tdef(x,y);const w=idef(G.p.eq.w);if(!(w.minep||hasItem('pick'))){msg('You need a pickaxe.','warn');return}noise(x,y,8,'p');if(d.ore===2)addItem(L,G.p.x,G.p.y,mk('starore',ri(1,2)));else if(d.ore)addItem(L,G.p.x,G.p.y,mk('ironore',ri(1,3)));else if(d.crys)addItem(L,G.p.x,G.p.y,mk('crystalshard',ri(1,2)));else if(d.k==='obsidian')addItem(L,G.p.x,G.p.y,mk('obsid',ri(1,2)));else addItem(L,G.p.x,G.p.y,mk('stone',ri(1,3)));tset(x,y,L.dark?'cavefloor':'rubble');msg('The rock comes apart.','');advance(300)}
function digTreasure(){const p=G.p;const m=p.inv.find(i=>i.k==='treasuremap'&&i.tx!=null&&dist(i.tx,i.ty,p.x,p.y)<=2);if(!hasItem('shovel')){msg('You need a shovel.','warn');return}if(m){p.inv.splice(p.inv.indexOf(m),1);G.marks=G.marks.filter(q=>q.x!==m.tx||q.y!==m.ty);const loot=[mk('coins',ri(80,200)),mk(pick(['stariron','pearl','ring','scale','dust']),ri(2,4)),mk(pick(['scroll','breathpot','spyglass']))];loot[2].sp=pick(Object.keys(SPELLS));loot.forEach(i=>giveItem(i));msg('Your shovel strikes a chest!','good');story('Dug up buried treasure.',2);gainXP(20)}else{msg('You dig a hole. Nothing.','');tset(p.x,p.y,'pit')}advance(250)}
function chopTile(x,y){const d=tdef(x,y);noise(x,y,8,'p');addItem(L,G.p.x,G.p.y,mk(d.k==='bamboo'?'bamboo':'wood',ri(2,3)));if(d.k==='palm'&&chance(.4))addItem(L,G.p.x,G.p.y,mk('coconut'));tset(x,y,d.k==='shroom'?'mud':'stump');msg('It comes down.','');if(d.hive)angerBees(x,y);advance(250)}
function angerBees(x,y){for(let i=0;i<3;i++){const c=spawn('bees',clamp(x+ri(-1,1),1,L.w-2),clamp(y+ri(-1,1),1,L.h-2),{grudge:{p:1},alert:2,wild:1})}msg('The hive erupts!','bad')}
function forageTile(x,y){const d=tdef(x,y);const bk=biomeKey(x,y),se=seasonIdx();if(d.k==='bush'){giveItem(mk('berries',ri(2,se===2?5:3)));if(chance(.15))giveItem(mk('seed'+pick(['wheat','turnip','gourd','rice']),1));tset(x,y,'bushbare')}else if(d.k==='mushrooms'){if(chance(.25))giveItem(mk('madcap'));else giveItem(mk('mushroom',ri(1,3)));tset(x,y,L.dark?'cavefloor':'moss')}else if(d.k==='herb'){const pool={jungle:['bloodmoss','dreamroot','ashcap','madcap'],bamboo:['dreamroot','sunleaf'],mangrove:['bloodmoss','ashcap'],swamp:['bloodmoss','ashcap','madcap'],desert:['sunleaf','ashcap'],badlands:['sunleaf','emberroot'],volcanic:['emberroot'],tundra:['frostlily','sunleaf'],taiga:['frostlily','bloodmoss'],glacier:['frostlily'],mountain:['sunleaf','bloodmoss','frostlily'],highland:['dreamroot','sunleaf']}[bk]||['bloodmoss','sunleaf','dreamroot'];giveItem(mk(pick(pool),G.p.herb?2:1));tset(x,y,'grass')}else if(d.k==='cactus'){hurt(G.p,1,null,'cactus');giveItem(mk('cactusfruit',ri(1,2)));tset(x,y,'sand')}else if(d.k==='salt'){giveItem(mk('salt',ri(1,3)))}else if(d.k==='shard'){giveItem(mk('crystalshard',1));tset(x,y,'salt')}advance(120)}
function harvestCrop(x,y){const k=IX(x,y),c=L.crops[k];if(!c)return;const def=CROPS[c.c];if(c.a<def.grow){msg('Not ripe yet.','hint');return}if(!c.o&&nearSite(x,y,4)&&RT.act.some(o=>SP[o.s].tags.person&&visible(o.x,o.y)&&!hostile(o,G.p)))crime('theft',{fac:'free',nation:nearSite(x,y,4).nation});giveItem(mk(def.item,def.q+(seasonIdx()===2?1:0)));if(chance(.6))giveItem(mk('seed'+c.c),true);delete L.crops[k];gainXP(2);advance(120)}
function plant(x,y,it){const k=IX(x,y);if(seasonIdx()===3){msg('The ground is frozen. Wait for spring.','warn');return}takeItem(it.k);L.crops[k]={c:idef(it).crop,a:0,o:1};msg('You plant '+CROPS[idef(it).crop].n+'.','good');advance(100)}
function waterCrop(x,y){const k=IX(x,y),c=L.crops[k];if(c&&takeItem('water')){c.w=G.turn+60;giveItem(mk('flask'),true);msg('You water the crop.','');advance(100)}}
function douse(x,y){if(!takeItem('water'))return;giveItem(mk('flask'),true);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)delete L.fire[IX(x+dx,y+dy)];addGas(x,y,'steam',3);const e=at(x,y);if(e&&!isP(e)){e.burning=0;e.wet=8}msg('You douse the flames.','good');advance(90)}
function lockPct(){return clamp(25+eff('sth')*5+eff('agi')*3,10,95)}
function lockpickTile(x,y){const d=tdef(x,y);if(!hasItem('lockpick')){msg('You have no lockpicks.','warn');return}if(chance(lockPct()/100)){tset(x,y,d.gate?'gateopen':'dooropen');msg('The lock clicks open.','good');gainXP(4);const cap=RT.act.find(c=>c.captive&&dist(c.x,c.y,x,y)<=3);if(cap)msg(cname(cap)+' stares at you, hardly daring to hope.','hint')}else{msg('The pick snaps in the lock.','warn');takeItem('lockpick');noise(x,y,6,'p')}advance(150)}
function buildAt(k,x,y){const B=BUILD[k];if(dist(G.p.x,G.p.y,x,y)>1&&k!=='soil'){msg('Stand next to the spot.','warn');return}const d=tdef(x,y);if(at(x,y)&&!isP(at(x,y))){msg('Something is standing there.','warn');return}if(B.vessel){if(!(d.water||d.swim)||d.icy){msg('Boats go on open water.','warn');return}if(B.pier&&!DIRS.some(([a,b])=>tdef(x+a,y+b).pier)){msg('A longship must be built beside a pier.','warn');return}if(vesselAt(x,y)){msg('Something is already moored there.','warn');return}}else if(k==='bridge'){if(!d.water&&!d.swim){msg('Bridges go on water.','warn');return}}else if(!(d.p&&!d.water&&!d.link&&!d.sacred&&d.k!=='throne'&&d.k!=='pier')){msg('You cannot build there.','warn');return}if(B.tool&&!hasItem(B.tool)){msg('You need a '+ITEMS[B.tool].n.toLowerCase()+'.','warn');return}for(const[m,q]of Object.entries(B.need))if(count(m)<q){msg('You need '+q+' '+ITEMS[m].n.toLowerCase()+'.','warn');return}if(nearSite(x,y,0)&&!B.vessel&&!['soil','campfire'].includes(k)){const s=nearSite(x,y,0);if(s.fac!=='horde'&&RT.act.some(c=>c.site===s.id&&visible(c.x,c.y))){msg('Locals object to you building in their town.','warn');return}}Object.entries(B.need).forEach(([m,q])=>takeItem(m,q));if(B.vessel){const v=newVessel(B.vessel,x,y,'p');msg('You build a '+B.vessel+'. Walk onto it to board.','good');story('Built a '+B.vessel+'.',2);gainXP(B.vessel==='longship'?25:5);advance(B.vessel==='longship'?600:300);return}tset(x,y,k);if(TDEF[k].store)L.stores[IX(x,y)]=[];msg('You build '+B.n.toLowerCase()+'.','good');gainXP(1);noise(x,y,5,'p');advance(150)}
function takeStore(x,y,it){const k=IX(x,y),st=L.stores[k];st.splice(st.indexOf(it),1);giveItem(it);advance(50)}
function putStore(x,y,it){const k=IX(x,y);const p=G.p;p.inv.splice(p.inv.indexOf(it),1);if(p.eq.w===it)p.eq.w=null;if(p.eq.a===it)p.eq.a=null;(L.stores[k]=L.stores[k]||[]).push(it);msg('Stored.','');advance(40)}
function gatherSmoke(x,y){const near=(L.gas[IX(x,y)]||{}).k==='smoke'||DIRS.some(([a,b])=>(L.gas[IX(x+a,y+b)]||{}).k==='smoke');if(near||seasonIdx()===3){giveItem(mk('honey',ri(1,3)));giveItem(mk('wax',1));msg(seasonIdx()===3?'The cold has the bees torpid. You take the comb.':'The smoke keeps the bees docile. You take the comb.','good');tset(x,y,'tree')}else{angerBees(x,y);giveItem(mk('honey',1))}advance(150)}
function drinkTile(x,y){const d=tdef(x,y);const p=G.p;const bk=biomeKey(x,y);if(d.ocean){p.thirst=clamp(p.thirst-10,0,100);msg('Salt water. It makes you thirstier.','bad');advance(50);return}p.thirst=clamp(p.thirst+40,0,100);msg('You drink deep.','good');if((d.k==='bog'||['jungle','swamp','mangrove'].includes(bk)&&d.water)&&chance(.2))infect(p,'marsh');else if(d.water&&!['oasis','spring'].includes(d.k)&&!d.waterSrc&&chance(.05))infect(p,'rot');if(d.fountain&&chance(.25))fountainEffect();advance(70)}
function fountainEffect(){const p=G.p;const r=R();if(r<.3){p.hp=p.mh;msg('The water is cold and sweet. Your wounds close.','good')}else if(r<.5){p.mp=p.mmp;msg('Your mind clears.','good')}else if(r<.6){giveItem(mk('coins',ri(5,30)));msg('There are coins at the bottom.','good')}else if(r<.7){const sp=passableSpot(p.x,p.y,2);if(sp){spawn('wisp',sp.x,sp.y,{wild:1,alert:2});msg('Something rises from the water!','bad')}}else if(r<.75&&!G.flags.wished){G.flags.wished=1;giveItem(mk('scale',2));msg('A voice in the water grants you a small wish. Two dragon scales glint in your hand.','story');story('Was granted a wish by a fountain.',3)}else msg('Just water.','')}

 case'cure':if(P){msg('You feel cleaner inside.','good')}else{delete t.dz}break;case'purge':if(P){p.fx.poison&&delete p.fx.poison;p.hunger=Math.max(0,p.hunger-10);msg('You purge everything. Awful, but cleansing.','good')}else{delete t.dz;t.poison=0}break;
 case'sleep':if(P){msg('Your eyes close.','bad');RT.forceWait=2+mag}else if(!SP[t.s].tags.undead){t.sleep=20+mag*5;t.ko=1}break;case'poison':if(P)p.fx.poison={t:6+mag*2};else{t.poison=8+mag*2;t.poisonBy='p'}break;
 case'warm':if(P)p.fx.warm={t:60+mag*20};break;case'cool':if(P)p.fx.cool={t:60+mag*20};break;case'haste':if(P)p.fx.haste={v:Math.ceil(mag/2),t:30+mag*8};else t.en=(t.en||0)+100;break;case'might':if(P){p.fx.might={v:Math.ceil(mag/2),t:40+mag*8};recalc()}break;
 case'invis':if(P){p.fx.invis={t:15+mag*5};msg('You fade from sight.','good')}else t.hidden=1;break;case'gills':if(P){p.fx.gills={t:100+mag*30};msg('Your neck tingles. You can breathe water.','good')}break;case'mana':if(P)p.mp=Math.min(p.mmp,p.mp+5+mag*3);break;
 case'madness':if(P)infect(p,'mania');else{t.dz='mania';t.dzT=150}break;case'waterwalk':if(P){p.fx.waterwalk={t:30+mag*10};msg('Water feels like stone underfoot.','good')}break;case'night':if(P){p.fx.night={t:120};msg('The dark brightens.','good')}break;
 case'fear':if(P){p.dom=Math.max(p.dom,2);msg('Terror grips you!','bad')}else t.fear=10+mag*2;break;case'luck':if(P){p.fx.luck={t:200};msg('You feel lucky.','good')}break;case'berserk':if(P){p.fx.might={v:3,t:20};p.fx.berserk={t:20};msg('Red rage! You hit harder and care less.','good')}else{t.confused=6}break;
 case'regen':if(P){p.fx.regen={t:60+mag*10};msg('Your flesh knits itself.','good')}break;case'calm':if(P){p.dom=0;msg('A deep calm settles over you.','good')}else{t.truce=G.turn+60;delete t.grudge;t.alert=0}break;case'mind':if(P){p.mp=Math.min(p.mmp,p.mp+3);p.dz.forEach(z=>z.known=true);msg('Your mind is crystal clear. You understand your ailments.','good')}break;
 case'ward':if(P){p.fx.ward={t:200};p.fx.absorb={v:10+mag*3,t:60};msg('A faint ward settles on you.','good')}break;case'slow':if(P)p.fx.slowP={t:20};else t.slow=10+mag*2;break;case'blind':if(P){msg('Your vision dims!','bad');p.fx.blind={t:15}}else t.confused=4;break}}
function throwPotion(it,x,y){const p=G.p;let fx,mag;if(it.k==='brew'){fx=idef(it).fx;mag=idef(it).mag}else{fx=[it.pt];mag=3}if((it.q||1)>1)it.q--;else p.inv.splice(p.inv.indexOf(it),1);RT.fxq.push({type:'burst',x,y,e:'potion'});msg('The flask shatters into a cloud of vapor.','');let ided=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const e=at(x+dx,y+dy);if(e&&!isP(e)){fx.forEach(f=>potionEffect(f,Math.max(1,mag-1),e));ided=true;if(SP[e.s].tags.person&&!hostile(e,p)&&fx.some(f=>BADP.has(f)))crime('assault',e)}}if(it.k==='potion'&&ided&&!G.alch.idPot[it.pt]&&chance(.5)){G.alch.idPot[it.pt]=1;msg('From the effect, it must be '+APNAME[it.pt].toLowerCase()+'.','hint')}if(fx.includes('poison'))for(let i=0;i<5;i++)addGas(x+ri(-1,1),y+ri(-1,1),'poison',3);if(fx.includes('sleep'))for(let i=0;i<5;i++)addGas(x+ri(-1,1),y+ri(-1,1),'sleepgas',3);if(fx.includes('madness'))for(let i=0;i<5;i++)addGas(x+ri(-1,1),y+ri(-1,1),'mania',3);noise(x,y,4,'p');advance(100)}
function dipWeapon(pot){const p=G.p;const w=p.eq.w;if(!w){msg('Wield a weapon first.','warn');return}const fx=pot.k==='brew'?idef(pot).fx:[pot.pt];if(!fx.some(f=>['poison','sleep','madness','fear','slow'].includes(f))){msg('That would do nothing on a blade.','hint');return}if((pot.q||1)>1)pot.q--;else p.inv.splice(p.inv.indexOf(pot),1);giveItem(mk('flask'),true);p.coat={fx:fx.filter(f=>BADP.has(f)),n:5};msg('You coat your weapon. The next 5 hits carry '+p.coat.fx.map(f=>APNAME[f].toLowerCase()).join(' and ')+'.','good');advance(60)}
function mixPotions(a,b){const p=G.p;const fa=a.k==='brew'?idef(a).fx:[a.pt],fb=b.k==='brew'?idef(b).fx:[b.pt];[a,b].forEach(it=>{if((it.q||1)>1)it.q--;else p.inv.splice(p.inv.indexOf(it),1)});if(chance(.15)){msg('The mixture boils violently and explodes!','bad');hurt(p,ri(4,10),null,'a bad mixture');giveItem(mk('flask'),true);advance(80);return}const fx=[...new Set(fa.concat(fb))].slice(0,4);giveItem({k:'brew',q:1,x:{n:potionName(fx),fx,mag:2,k:'potion',v:20+fx.length*10}},true);giveItem(mk('flask'),true);msg('You pour one into the other: '+potionName(fx)+'.','good');advance(80)}

function opener(c){const se=seasonIdx();if(c.fac==='horde')return pick(['What do you want, outlander?','Speak fast before I gut you.','The King sees everything.']);if(c.fac==='pirate')return pick(['Arr. Talk, or walk the plank.','You lost, landlubber?']);if(se===3&&c.hunger>60)return'Spare any food? Winter\'s been cruel.';if(G.flags.festival&&chance(.5))return'Happy harvest! Eat, drink!';return pick(OPENERS[c.pers]||OPENERS.friendly)}

function pChance(c,base){const p=G.p;let v=base+eff('int')*4+p.speak;v+=Math.round(repOf(c)/5);if(c.hp<c.mh*.5)v+=10;if(c.annoy)v-=c.annoy*12;if(disguised(c))v+=20;const se=seasonIdx();if(se===2)v+=5;if(se===3&&c.hunger>60)v+=8;if(c.dz==='mania')v-=40;if(SP[c.s].tags.dim)v+=15;if(p.dz.some(z=>DISEASE[z.k].shun&&dzActive(z)))v-=20;if(c.pers==='suspicious')v-=8;if(c.pers==='kind'||c.pers==='friendly')v+=6;if(p.fx.luck)v+=8;return clamp(Math.round(v),5,95)}

function priceMul(k){const d=ITEMS[k]||{};const se=seasonIdx();let m=1;if(d.k==='food'){m=[1.1,1,.65,2][se];if(G.flags.festival)m*=.7}if(k==='furcoat'||k==='pelt')m*=se===3?1.6:se===1?.7:1;if(k==='shroud'||k==='water')m*=se===1?1.6:1;if((k==='tonic'||k==='salve')&&(G.flags.grey||G.flags.mania))m*=1.8;return m}

function genStock(c){const list=(STOCK[c.s]||STOCK.merchant).filter(k=>k!=='snare'&&k!=='spikes');if(natTrait(c,'scholar'))list.push('scroll:'+pick(Object.keys(SPELLS)));if(natTrait(c,'gunpowder'))list.push('musket','powder');if(natTrait(c,'herbal'))list.push('tonic','salve','POT');c.stock=list.filter(k=>k.startsWith('scroll')||k==='POT'||ITEMS[k]).map(k=>{if(k.startsWith('scroll:'))return{k:'scroll',sp:k.split(':')[1],q:1};if(k==='POT')return randomPotion();return{k,q:ri(1,4)}})}

const MOONN=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];

function augOn(){return G.p.aug&&Object.keys(G.p.aug).length>0}

function augBonus(st){const p=G.p;if(!p.aug)return 0;let v=0;for(const k in p.aug){const a=AUGS[k];if(a[st])v+=p.charge>0?a[st]:Math.round(-a[st]/2)}return v}

function solarRate(){const p=G.p;if(!L.world||isNight()||eclipse()||tdef(p.x,p.y).indoor)return 0;let r=1;const bk=biomeKey(p.x,p.y);if(['desert','saltflat','badlands','savanna','beach','glacier','sea','deep'].includes(bk))r=1.6;if(['jungle','darkwood','taiga','bamboo','fungal'].includes(bk))r=.5;if(['rain','storm','fog','snow','blizzard','ashfall','sandstorm'].includes(G.wx.k))r*=.25;r*=[1,1.3,.8,.5][seasonIdx()];const h=dayFrac();r*=Math.max(.2,1-Math.abs(h-.42)*2.2);if(p.aug&&p.aug.skin)r*=2;return r}

function vFromRecord(c,r){if(!r||!VEH[r.kind])return;if(vehCost({kind:r.kind},c.x,c.y)<=0&&VEH[r.kind].terr!=='air')return;if(vesselAt(c.x,c.y))return;const v=newVessel(r.kind,c.x,c.y,c.id,{hp:r.hp??VEH[r.kind].hp,pull:r.pull,ammo:r.ammo??8,fuel:r.fuel??(VEH[r.kind].power==='solar'?100:VEH[r.kind].power==='arcane'||VEH[r.kind].power==='fire'?4:0),hold:r.hold||[],cannons:r.cannons||0,drv:c.id,fac:c.fac});c.veh=v.id;if(VEH[r.kind].power==='animal'&&!v.pull){v.pull=c.mount?c.mount.s:'horse'}if(c.mount&&VEH[r.kind].power==='animal')c.mount=null}
const _abstractCV=abstractC;abstractC=function(c){if(c.veh){const v=vesselById(c.veh);if(v){const rec=vRecord(v);if(c.band!==undefined){const b=G.bands.find(q=>q.id===c.band);if(b&&b.members[c.bi])b.members[c.bi].veh=rec}else if(c.site!==undefined&&c.rec!==undefined){const s=G.sites[c.site];if(s.pop&&s.pop[c.rec]&&!c.boatDay)s.pop[c.rec].veh=rec}G.vessels=G.vessels.filter(q=>q!==v);RT.vix=null}c.veh=null}return _abstractCV(c)};
const _realizeBandV=realizeBand;realizeBand=function(b){_realizeBandV(b);b.members.forEach((m,i)=>{if(!m.veh||m.dead)return;const id=RT.live.get('b'+b.id+'_'+i);const c=id&&L.cr.find(q=>q.id===id);if(c&&!c.veh)vFromRecord(c,m.veh)})};
const _realizeSiteV=realizeSite;realizeSite=function(s){_realizeSiteV(s);if(!L.world)return;(s.pop||[]).forEach(r=>{if(!r.veh||!r.alive)return;const id=RT.live.get('s'+s.id+'_'+r.i);const c=id&&L.cr.find(q=>q.id===id);if(c&&!c.veh)vFromRecord(c,r.veh)});if(!s.vehDone){s.vehDone=1;try{parkSiteVehicles(s)}catch(e){}}boatsOut(s)};
function landSpotFor(kind,x,y,r){const fake={kind};for(let rad=0;rad<=r;rad++)for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==rad)continue;const a=x+dx,b=y+dy;if(!inb(L,a,b)||at(a,b)||vesselAt(a,b))continue;if(VEH[kind].terr!=='air'&&vehCost(fake,a,b)<=0)continue;if(VEH[kind].terr==='air'&&!tdef(a,b).p)continue;if(VEH[kind].terr!=='water'&&tdef(a,b).k==='road'&&rad<r-2&&chance(.7))continue;return{x:a,y:b}}return null}
function parkSiteVehicles(s){const T=s.type,bk=BIOMES[s.b]?BIOMES[s.b][0]:'grass';const cold=['tundra','glacier','taiga'].includes(bk),sandy=['desert','saltflat','badlands','beach'].includes(bk);const L2=[];const add=(k,o)=>L2.push([k,o||{}]);
 if(T==='village'){if(chance(.6))add('handcart');if(chance(.3))add('wagon',{pull:'ox'});if(cold&&chance(.5))add('dogsled');if(sandy&&chance(.4))add('sandskiff')}
 if(T==='town'){add('wagon',{pull:'horse'});add('handcart');if(chance(.5))add('chariot',{pull:'horse'});if(chance(.35))add('warwagon',{pull:'ox'})}
 if(T==='port'||T==='islevillage'){add('rowboat');add('canoe');if(T==='port'&&chance(.5))add('cog',{cannons:1});if(T==='port'&&chance(.3))add('barge')}
 if(T==='hport'||T==='cove'){add('sloop',{cannons:2});add('rowboat')}
 if(T==='fort'){add('ballista');if(chance(.5))add('bombard',{pull:'ox'})}
 if(T==='hfort'){add('catapult');add('scythe',{pull:'bigwolf'})}
 if(T==='citadel'||T==='keep'){add('catapult');add('catapult');add('ram');add('scythe',{pull:'bigwolf'})}
 if(T==='nomads'){if(sandy)add('sandskiff');add('wagon',{pull:'camel'})}
 if(T==='hunters'&&cold)add('dogsled');if(T==='witch'&&chance(.3))add('balloon',{fuel:3});if(T==='seawitch')add('skyskiff',{fuel:2});
 if(T==='vault'){add('strider',{free:1});if(chance(.6))add('crawler',{free:1})}
 if(T==='lighthouse')add('rowboat');if(T==='wreck'&&chance(.4))add('raft',{free:1,hp:12});
 L2.forEach(([k,o])=>{const sp=VEH[k].terr==='water'?waterSpot(s.x,s.y,s.r+8):landSpotFor(k,s.x,s.y+Math.floor(s.r*.6),s.r+3);if(!sp)return;newVessel(k,sp.x,sp.y,o.free?null:'site',Object.assign({site:s.id,fac:s.fac,ammo:8,fuel:VEH[k].power==='solar'?100:o.fuel||0},o))})}

function boatsOut(s){if(!['port','islevillage','village'].includes(s.type)||isNight()||RT.boatsT===G.turn)return;(s.pop||[]).forEach(r=>{if(!r.alive||!['fisher','islander'].includes(r.s)||chance(.5))return;const id=RT.live.get('s'+s.id+'_'+r.i);const c=id&&L.cr.find(q=>q.id===id);if(!c||c.veh)return;const w=waterSpot(c.x,c.y,10);if(!w||at(w.x,w.y)||vesselAt(w.x,w.y))return;moveC(c,w.x,w.y);const v=newVessel(chance(.6)?'canoe':'rowboat',w.x,w.y,c.id,{drv:c.id,fac:c.fac});c.veh=v.id;c.boatDay=1;c.job='idle'})}

const _visionRV=visionR;visionR=function(...a){let r=_visionRV(...a);if(G.p&&G.p.aboard){const v=vesselById(G.p.aboard);if(v&&vdef(v).terr==='air')r+=4}return r};
// ---- buying and building
function buyVehicleOpts(c){const r=c.role||c.s,s=nearSite(c.x,c.y,10);const bk=L.world?biomeKey(c.x,c.y):'cave';const cold=['tundra','glacier','taiga'].includes(bk)||seasonIdx()===3&&['birch','highland','steppe'].includes(bk),sandy=['desert','saltflat','badlands','beach','savanna'].includes(bk);const T=s?s.type:'';const big=['town','port'].includes(T)||s&&s.mega;let ks=[];
 if(r==='stablemaster'||c.s==='stablemaster'){ks=['handcart',['wagon','horse'],['chariot','horse']];if(big)ks.push(['warwagon','ox']);if(cold)ks.push('dogsled','iceyacht');if(sandy)ks.push('sandskiff')}
 else if(r==='shipwright'||c.s==='shipwright'){ks=['canoe','rowboat','barge'];if(big||T==='port')ks.push('cog','galley');if(s&&s.mega)ks.push('galleon');if(cold)ks.push('iceyacht')}
 else if(c.s==='fisher'||c.s==='islander')ks=['canoe','rowboat'];
 else if(c.s==='smith'&&(big||T==='fort'))ks=['handcart','ballista',['bombard','ox']];
 else if(c.s==='artificer')ks=['crawler','strider'];
 else if(c.s==='scholar')ks=['balloon'];else if(c.s==='witch'||c.s==='seawitch')ks=['skyskiff','balloon'];
 else if(c.s==='nomad'||c.s==='nelder')ks=['sandskiff',['wagon','camel']];else if(c.s==='hunter'&&cold)ks=['dogsled'];
 return ks.map(k=>{const[kind,pull]=Array.isArray(k)?k:[k];const D=VEH[kind];const price=Math.round((D.price+(pull?110:0))*priceMul(c));return{label:'Buy a '+D.n+(pull?' with a '+MOUNTS[pull].n:''),sub:price+' coins. '+D.d,disabled:G.p.coins<price,fn:()=>{const sp=D.terr==='water'?waterSpot(c.x,c.y,14):landSpotFor(kind,G.p.x,G.p.y,6);if(!sp){msg(D.terr==='water'?'There is no open water close enough.':'There is no room to bring it round here.','warn');return null}G.p.coins-=price;const v=newVessel(kind,sp.x,sp.y,'p',{pull,fuel:D.power==='solar'?100:D.power==='arcane'||D.power==='fire'?5:0,ammo:8,cannons:D.cannons?Math.min(2,D.cannons):0});if(D.wpn&&D.wpn.ammo)v.hold.push(mk(D.wpn.ammo,D.wpn.ammo==='stoneblock'?6:10));msg('The '+D.n+' is yours. It waits nearby.','good');sfx('coin');G.marks.push({x:sp.x,y:sp.y,t:'Your '+D.n});return reply(c,'"Treat her well."')}}})}
const _talkSheetV=talkSheet;talkSheet=function(c,...ta){const r=_talkSheetV(c,...ta);try{if(r&&r.options&&c&&!hostile(c,G.p)){const o=buyVehicleOpts(c);if(o.length){const i=r.options.findIndex(q=>q.label==='Leave');r.options.splice(i<0?r.options.length:i,0,{label:'Ask about vehicles for sale',sub:o.length+' for sale',fn:()=>({title:cname(c)+"'s vehicles",text:'Everything comes ready to drive. Vehicles that need a draft animal include one.',options:o.concat([{label:'Back',fn:()=>talkSheet(c)}])})})}}}catch(e){}return r};
Object.assign(BUILD,{handcart:{n:'Handcart',need:{wood:6},veh:'handcart'},canoe:{n:'Canoe (place on water)',need:{wood:5},veh:'canoe'},iceyacht:{n:'Ice yacht',need:{wood:6,rope:2,pelt:2},veh:'iceyacht'},sandskiff:{n:'Sand skiff',need:{wood:8,rope:3,pelt:3},veh:'sandskiff'},ballista:{n:'Field ballista',need:{wood:10,rope:3,iron:2},veh:'ballista',tool:'hammer'},catapult:{n:'Catapult',need:{wood:14,rope:4},veh:'catapult'},ram:{n:'Battering ram',need:{wood:16,iron:3},veh:'ram'},balloon:{n:'Hot-air balloon',need:{pelt:10,rope:6,wood:4},veh:'balloon'}});

const _buildAtV=buildAt;buildAt=function(k,x,y){const B=BUILD[k];if(!B||!B.veh)return _buildAtV(k,x,y);if(dist(G.p.x,G.p.y,x,y)>1){msg('Stand next to the spot.','warn');return}if(at(x,y)&&!isP(at(x,y))||vesselAt(x,y)){msg('Something is in the way.','warn');return}if(vehCost({kind:B.veh},x,y)<=0&&!(VEH[B.veh].terr==='air'&&tdef(x,y).p)){msg('A '+VEH[B.veh].n+' cannot stand there.','warn');return}if(!Object.entries(B.need).every(([m,q])=>count(m)>=q)){msg('You lack the materials.','warn');return}Object.entries(B.need).forEach(([m,q])=>takeItem(m,q));newVessel(B.veh,x,y,'p',{fuel:VEH[B.veh].power==='solar'?100:0});msg('You build a '+VEH[B.veh].n+'.','good');G.stats.crafted++;advance(400)};

 const v=vesselAt(x,y);if(v&&!(mine&&mine===v)){const D=vdef(v);r.text=(r.text||'')+' '+(v.drv?'Someone is driving a '+D.n+'.':(v.owner==='p'?'Your ':v.free?'An abandoned ':'A ')+D.n+(v.owner==='site'||typeof v.owner==='number'?' (not yours)':'')+'. '+vStatus(v));

function helpScreen(){const b=el('div','char',`<h4>Moving</h4><p class="small">Tap a far tile to walk there, or use the pad. Tap anything else to see what you can do with it; long-press or right-click for every option. Keyboard: arrows, numpad, or hjklyubn; Space for your own tile; . to wait; +/- to zoom; F to fish.</p><h4>Goal</h4><p class="small">Vorgath rules from a sealed keep on his own continent. Each other continent has a sub-king holding a shard of the seal. Each sub-king has a weakness: pride, greed, fear, faith, hunger, riddles, drink, sickness, paranoia, or secret rebellion. Ask locals about the sub-king to learn it, then win his shard however you like. Every shard, and the ending, can be won without killing anyone.</p><h4>Crossing the sea</h4><p class="small">Book passage at a port, or build a raft or buy a longship. Steer onto water to sail and into land to step ashore. Fit cannons for pirates and sea monsters. Fish from the deck.</p><h4>The world lives without you</h4><p class="small">Armies march along roads and lay siege to towns. Nations fight back. Caravans trade, herds migrate, pirates raid coasts, monsters roam, and plagues spread from village to village. Everything you hear in "What news?" really happened somewhere.</p><h4>Checks</h4><p class="small">Risky actions roll a d20 against a difficulty, and the result appears in your log. Heroic moments grant inspiration, which rerolls your next failure. Independent creatures roll 2d6 to react when they first meet you; wounded and leaderless enemies may break and flee, or surrender.</p><h4>Body</h4><p class="small">Watch food, water, temperature, and disease. Diseases incubate silently, then show symptoms; healers can diagnose them. Vampirism and moon-blood can be cured. Solar augments make you strong but need sunlight.</p><h4>Alchemy</h4><p class="small">Every ingredient has four hidden properties, different every world. Taste ingredients to learn them; brew two or three together and the shared proper function createScreen(){$('#title').hidden=true;$('#create').hidden=false;UI.pick=UI.pick||'mage';UI.bg=UI.bg||'outlander';const list=$('#classes');list.innerHTML='';Object.entries(CLASSES).forEach(([k,c])=>{const b=el('button','classcard'+(k===UI.pick?' sel':''));b.innerHTML=`<h3>${esc(c.n)}</h3><p>${esc(c.d)}</p><div class="cstats">${Object.keys(STATN).map(s=>`<span title="${STATN[s]}">${STATN[s].slice(0,3)} <b>${c.st[s]}</b></span>`).join('')}</div>`;b.onclick=()=>{UI.pick=k;createScreen()};list.appendChild(b)});const bl=$('#bgs');bl.innerHTML='';Object.entries(BACKGROUNDS).forEach(([k,b])=>{const e=el('button','chip'+(k===UI.bg?' on':''),esc(b.n));e.title=b.d;e.onclick=()=>{UI.bg=k;createScreen()};bl.appendChild(e)});$('#bgdesc').textContent=BACKGROUNDS[UI.bg].d;const wo=$('#wopts');if(!wo.childElementCount){WOPTS.forEach(([k,lab,vals,def])=>{const w=el('label','fld',`<span>${lab}</span>`);const s=el('select');s.id='wo_'+k;vals.forEach(([v,t])=>{const o=el('option','',esc(t));o.value=v;if(def!==undefined&&String(v)===String(def))o.selected=true;s.appendChild(o)});w.appendChild(s);wo.appendChild(w)})}}
function readOpts(){const o={};WOPTS.forEach(([k,,vals])=>{const v=$('#wo_'+k).value;o[k]=isNaN(+v)?v:+v});return o}
function beginGame(){const name=$('#pname').value.trim()||pickName();const seedV=$('#pseed').value.trim();let seed;if(seedV==='daily'){const d=new Date();seed=d.getFullYear()*372+d.getMonth()*31+d.getDate()}else if(seedV){seed=0;for(const ch of seedV)seed=(seed*31+ch.charCodeAt(0))|0;seed=Math.abs(seed)||1}$('#create').hidden=true;$('#loading').hidden=false;setTimeout(()=>{newGame({cls:UI.pick,name,seed,opt:readOpts()});applyBackground(UI.bg);SPRC.player=null;delete SPRC['player|'];$('#loading').hidden=true;$('#game').hidden=false;applyDpad();sizeMap();saveGame();refresh()},30)}
function pickName(){const a=(['Ansa','Bram','Corvin','Dessa','Edda','Fenn','Galen','Hale','Isolde','Jory','Kes','Lark','Maren','Nell','Orrin','Pell','Quill','Rook','Sable','Tamsin','Una','Wren']);return a[Math.floor(Math.random()*a.length)]}
function continueGame(){$('#title').hidden=true;$('#loading').hidden=false;setTimeout(()=>{try{deserial(UI.saveStr);delete SPRC['player|'];$('#loading').hidden=true;$('#game').hidden=false;applyDpad();sizeMap();msg('Welcome back.','hint');refresh()}catch(e){console.error(e);$('#loading').hidden=true;$('#title').hidden=false;alert('Save could not be loaded.')}},30)}
function tickFrame(){UI.frame++;if(G&&G.p&&$('#game')&&!$('#game').hidden&&!G.over){draw();if(UI.frame%6===0)musicTick()}else if(UI.frame%6===0&&AU.on&&$('#title')&&!$('#title').hidden)musicTick()}
function start(data){UI.reducedM=reduced();UI.mini=true;loadSettings();bindMap();bindControls();$('#newbtn').onclick=()=>{audioInit();createScreen()};$('#contbtn').onclick=()=>{audioInit();continueGame()};$('#backbtn').onclick=titleScreen;$('#beginbtn').onclick=beginGame;$('#dailybtn').onclick=()=>{$('#pseed').value='daily'};addEventListener('resize',sizeMap);addEventListener('pagehide',saveGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});setInterval(tickFrame,160);if(document.fonts&&document.fonts.load)document.fonts.load('700 20px "Pixelify Sans"').then(()=>draw()).catch(()=>{});
 window.claude?.hot?.snapshot?.(()=>({save:G&&G.p&&!G.over?serial():null}));if(data&&data.save){try{deserial(data.save);$('#title').hidden=true;$('#game').hidden=false;applyDpad();sizeMap();refresh();return}catch(e){}}titleScreen()}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.claude)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
